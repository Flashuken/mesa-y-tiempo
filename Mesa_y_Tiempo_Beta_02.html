const state={mode:'categorias',countryCategory:'',sub:'Todas',searchMode:'nombre',query:'',sort:'az',filters:{max:0,tags:[]},draft:null,from:'inicio'};
const compare=(a,b)=>a.localeCompare(b,'es',{sensitivity:'base'});
const normalize=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function readIds(key){
  try {const values=JSON.parse(localStorage.getItem(key));return new Set(Array.isArray(values)?values:[]);}
  catch{return new Set();}
}
function storeIds(key,items){try{localStorage.setItem(key,JSON.stringify([...items]));}catch{/* storage can be disabled in private previews */}}
const favorites=readIds('mesa-tiempo-favoritas-v1');
const checked=readIds('mesa-tiempo-ingredientes-v2');
if (!localStorageHasIngredientVersion()) {
  for (const index of readIds('mesa-tiempo-ingredientes-v1')) {
    if (Number.isInteger(index)) checked.add('crema-de-muestra:'+index);
  }
  storeIds('mesa-tiempo-ingredientes-v2',checked);
}
function localStorageHasIngredientVersion(){
  try {return localStorage.getItem('mesa-tiempo-ingredientes-v2')!==null;}
  catch{return false;}
}
function current(){return (location.hash.slice(1)||'inicio').split('/');}
function cat(id){return categories.find(c=>c[0]===id);}
function countryId(country){return normalize(country).replace(/ /g,'-');}
function decodedCountry(id){
  try{return decodeURIComponent(id);}
  catch{return '';}
}
function recipeCountries(r){return r.countries.length?r.countries.map(countryId):['sin-asignar'];}
function countryIndex(){
  return '<ul class="listing">'+[...countries].map(([id,name])=>
    '<li><a class="recipe-row" href="#pais/'+encodeURIComponent(id)+'"><span class="category-icon" aria-hidden="true">✦</span><span><h3>'+escapeHTML(name)+'</h3><small>'+countLabel(recipes.filter(r=>recipeCountries(r).includes(id)).length)+'</small></span><span class="arrow" aria-hidden="true">›</span></a></li>'
  ).join('')+'</ul>';
}
function recipeSource(r){
  if(r.source){
    const pages=r.source.pages;
    return r.source.file+' · '+(pages.length===1?'pág. ':'págs. ')+pages.join(', ');
  }
  return r.url?'Velocidad Cuchara':'Receta de muestra';
}
function min(n){return n<60?n+' min':Math.floor(n/60)+' h'+(n%60?' '+n%60+' min':'');}
function photo(key,classes=''){return '<img '+(classes?'class="'+classes+'" ':'')+'alt="" src="'+images[key]+'">';}
function back(href,label){return '<a class="inline-link" href="#'+href+'">‹ '+label+'</a>';}
function button(label,action,{primary=false,selected,klass='btn'}={}){
  return '<button type="button" class="'+klass+(primary?' primary':'')+'" data-action="'+escapeHTML(action)+'"'+(selected===undefined?'':' aria-pressed="'+selected+'"')+'>'+label+'</button>';
}
function searchable(r,tag){return r.tags.some(t=>normalize(t).includes(normalize(tag)));}
function listFor(route,filters=state.filters){
  const [page,id]=route;
  let items=recipes;
  if(page==='guardadas')items=items.filter(r=>favorites.has(r.id));
  if(page==='pais')items=items.filter(r=>recipeCountries(r).includes(decodedCountry(id))&&(!state.countryCategory||r.category===state.countryCategory));
  if(page==='categoria')items=items.filter(r=>r.category===id&&(state.sub==='Todas'||r.sub===state.sub));
  if(page==='buscar'&&state.query&&state.searchMode==='nombre')items=items.filter(r=>normalize(r.title).includes(normalize(state.query)));
  items=items.filter(r=>(!filters.max||r.minutes<=filters.max)&&filters.tags.every(t=>searchable(r,t)));
  return [...items].sort((a,b)=>(state.sort==='tiempo'?a.minutes-b.minutes:0)||compare(a.title,b.title));
}
function rowRecipe(r){
  const thumbnail=r.image?photo(r.image):'<span class="category-icon" aria-hidden="true">✦</span>';
  return '<li><a class="recipe-row" href="#receta/'+r.id+'" data-recipe>'+thumbnail+'<span><h3>'+escapeHTML(r.title)+'</h3><small>'+min(r.minutes)+' · '+escapeHTML(recipeSource(r))+'</small></span><span class="arrow" aria-hidden="true">›</span></a></li>';
}
function tiles(items){
  return '<div class="grid">'+items.map(([id,title,image])=>'<a class="tile" href="#categoria/'+id+'" data-category>'+photo(image)+'<div><h3>'+title+'</h3><small>'+countLabel(recipes.filter(r=>r.category===id).length)+'</small></div></a>').join('')+'</div>';
}
function countLabel(n){return n+' '+(n===1?'receta':'recetas');}
function toolbar(){
  const {max,tags}=state.filters;
  const n=Number(Boolean(max))+tags.length;
  return '<div class="row between filterbar">'+button(icon('filter',18)+' Filtros'+(n?' ('+n+')':''),'filters')+'<label><span class="sr-only">Ordenar</span><select id="sort"><option value="az"'+(state.sort==='az'?' selected':'')+'>Ordenar: A–Z</option><option value="tiempo"'+(state.sort==='tiempo'?' selected':'')+'>Menor tiempo</option></select></label></div>'+
  (n?'<div class="row">'+(max?button('Hasta '+max+' min ×','clear-time',{klass:'chip',selected:true}):'')+tags.map(t=>button(escapeHTML(t)+' ×','remove:'+t,{klass:'chip',selected:true})).join('')+'</div>':'');
}
function resultHTML(route){
  const items=listFor(route);
  if(!items.length)return '<p class="empty muted">'+(route[0]==='guardadas'&&!favorites.size?'Aún no tienes recetas guardadas.':'No hay recetas con esos criterios.')+'</p>';
  return '<p class="muted">'+items.length+' '+(items.length===1?'receta':'recetas')+'</p><ul class="listing">'+items.map(rowRecipe).join('')+'</ul>';
}
function searchBox(id,value,placeholder){
  return '<label class="search">'+icon('search',20)+'<span class="sr-only">'+placeholder+'</span><input id="'+id+'" type="search" autocomplete="off" placeholder="'+placeholder+'" value="'+escapeHTML(value)+'"></label>';
}
function tagForm(id,value=''){
  return '<form id="'+id+'" class="stack"><label class="search">'+icon('search',19)+'<span class="sr-only">Ingrediente</span><input name="ingredient" list="ingredients-'+id+'" autocomplete="off" placeholder="Añadir ingrediente" value="'+escapeHTML(value)+'" required></label><datalist id="ingredients-'+id+'">'+[...catalog].sort(compare).map(t=>'<option value="'+escapeHTML(t)+'"></option>').join('')+'</datalist><button class="btn" type="submit">Añadir ingrediente</button></form>';
}
function render(){
  const [page,id,step]=current();
  const navPage=['receta','cocina'].includes(page)?state.from.split('/')[0]:page;
  const section=['categoria','pais','indice'].includes(navPage)?'indice':navPage==='guardadas'?'guardadas':'inicio';
  nav.innerHTML=[['inicio','Inicio','home'],['indice','Índice','book'],['guardadas','Guardadas','save']].map(([key,label,symbol])=>'<a href="#'+key+'"'+(section===key?' aria-current="page"':'')+'>'+icon(symbol,22)+label+'</a>').join('');
  if(page==='inicio'){
    const demo=recipes.find(r=>r.id==='crema-de-muestra')||bundledRecipes[0];
    app.innerHTML='<div class="stack"><h1>Tu recetario</h1><form id="quick">'+searchBox('quick-search','','Busca una receta o ingrediente')+'<button type="submit" class="btn primary">Buscar</button></form><section class="hero">'+photo('demo')+'<div class="hero-copy"><p class="kicker">Modo cocina · Receta de muestra</p><h2>'+escapeHTML(demo.title)+'</h2><p>30 min · 4 raciones</p><a class="btn" href="#receta/'+demo.id+'" data-recipe>Ver receta</a></div></section></div><section class="section"><div class="row between"><h2>Explora por categoría</h2><a class="inline-link" href="#indice">Ver índice</a></div>'+tiles(categories)+'</section>';
  }else if(page==='indice'){
    const alpha={};
    [...recipes].sort((a,b)=>compare(a.title,b.title)).forEach(r=>{const letter=normalize(r.title)[0].toUpperCase();(alpha[letter]??=[]).push(r);});
    const index=Object.entries(alpha);
    app.innerHTML='<section class="stack"><h1>Índice de recetas</h1><div class="tabset index-tabs" aria-label="Vista del índice">'+button('Categorías','index:categorias',{selected:state.mode==='categorias'})+button('Por país','index:paises',{selected:state.mode==='paises'})+button('A–Z','index:az',{selected:state.mode==='az'})+'</div>'+
    (state.mode==='categorias'?tiles(categories):state.mode==='paises'?countryIndex():'<nav class="row letters" aria-label="Saltar a una inicial">'+index.map(([l])=>button(l,'letter:'+l,{klass:'chip'})).join('')+'</nav>'+index.map(([l,rs])=>'<section><h2 id="letra-'+l+'" class="letter">'+l+'</h2><ul class="listing">'+rs.map(rowRecipe).join('')+'</ul></section>').join(''))+'</section>';
  }else if(page==='categoria'&&cat(id)){
    const [,name,image,sub]=cat(id);
    app.innerHTML='<section class="stack reading">'+back('indice','Índice')+photo(image,'category-photo')+'<h1>'+name+'</h1>'+(sub.length?'<div class="row">'+['Todas',...sub].map(s=>button(s,'sub:'+s,{klass:'chip',selected:state.sub===s})).join('')+'</div>':'')+toolbar()+'<div id="results" aria-live="polite">'+resultHTML([page,id])+'</div></section>';
  }else if(page==='pais'&&countries.has(decodedCountry(id))){
    const country=decodedCountry(id);
    const available=categories.filter(([key])=>recipes.some(r=>r.category===key&&recipeCountries(r).includes(country)));
    const picker='<label>Categoría <select id="country-category"><option value="">Todas</option>'+available.map(([key,name])=>'<option value="'+key+'"'+(state.countryCategory===key?' selected':'')+'>'+name+'</option>').join('')+'</select></label>';
    app.innerHTML='<section class="stack reading">'+back('indice','Índice')+'<h1>'+escapeHTML(countries.get(country))+'</h1>'+picker+toolbar()+'<div id="results" aria-live="polite">'+resultHTML([page,id])+'</div></section>';
  }else if(page==='buscar'){
    app.innerHTML='<section class="stack reading">'+back('inicio','Inicio')+'<h1>Buscar recetas</h1><div class="tabset" aria-label="Tipo de búsqueda">'+button('Por nombre','search:nombre',{selected:state.searchMode==='nombre'})+button('Por ingredientes','search:ingredientes',{selected:state.searchMode==='ingredientes'})+'</div>'+
    (state.searchMode==='nombre'?searchBox('name-search',state.query,'Nombre de la receta'):tagForm('search-tags'))+toolbar()+(state.searchMode==='ingredientes'?'<p class="muted">Coinciden todos los ingredientes que añadas. Las fichas enlazadas incluyen una selección de ingredientes para buscar.</p>':'')+'<div id="results" aria-live="polite">'+resultHTML([page])+'</div></section>';
  }else if(page==='guardadas'){
    app.innerHTML='<section class="stack reading"><h1>Guardadas</h1><p class="muted">Tus recetas favoritas en este navegador.</p>'+toolbar()+'<div id="results" aria-live="polite">'+resultHTML([page])+'</div></section>';
  }else if(page==='receta'||page==='cocina'){
    const r=recipes.find(item=>item.id===id);
    if(!r){location.hash='inicio';return;}
    if(page==='cocina'&&r.steps)renderStep(r,step);
    else renderRecipe(r);
  }else{location.hash='inicio';}
}
function renderRecipe(r){
  const image=r.image?photo(r.image,'detail-photo'):'';
  const link=r.steps
    ?(r.source?'':'<p class="muted">Foto ilustrativa. Receta de muestra sin prueba en cocina.</p>')+'<a class="btn primary" href="#cocina/'+r.id+'/1">Empezar a cocinar</a>'
    :'<p class="muted">Consulta las cantidades y la preparación completas en la publicación de Velocidad Cuchara.</p><a class="btn primary" href="'+escapeHTML(r.url)+'" target="_blank" rel="noopener">Abrir receta original ↗</a>';
  const country=r.countries.length?' · '+escapeHTML(r.countries.join(', ')):'';
  app.innerHTML='<article class="stack reading">'+back(state.from,'Volver al recetario')+image+'<p class="kicker">'+escapeHTML(recipeSource(r))+'</p><h1>'+escapeHTML(r.title)+'</h1><p class="muted">'+min(r.minutes)+(r.servings?' · '+escapeHTML(r.servings)+' raciones':'')+country+'</p>'+link+
  '<div>'+button(icon('save',17)+' '+(favorites.has(r.id)?'Guardada':'Guardar'),'favorite:'+r.id,{selected:favorites.has(r.id)})+'</div>'+
  (r.ingredients?ingredientList(r)+'<section class="info stack"><h2>Preparación</h2><ol>'+r.steps.map((s,i)=>'<li><a class="inline-link" href="#cocina/'+r.id+'/'+(i+1)+'">'+escapeHTML(s[0])+'</a></li>').join('')+'</ol>'+(r.note?'<p>'+escapeHTML(r.note)+'</p>':'')+'</section>':'<section class="info stack"><h2>Ingredientes destacados</h2><p>'+r.tags.map(escapeHTML).join(', ')+'.</p></section>')+'</article>';
}

function ingredientList(r){
  return '<section class="info stack"><h2>Ingredientes</h2><ul class="checks">'+r.ingredients.map((label,i)=>'<li><label><input type="checkbox" data-ingredient="'+r.id+':'+i+'"'+(checked.has(r.id+':'+i)?' checked':'')+'><span>'+escapeHTML(label)+'</span></label></li>').join('')+'</ul></section>';
}
function renderStep(r,step){
  const n=Math.min(r.steps.length,Math.max(1,Number.parseInt(step,10)||1));
  const [title,instruction,...settings]=r.steps[n-1];
  app.innerHTML='<article class="stack reading">'+back('receta/'+r.id,'Volver a la receta')+'<p class="kicker">Modo cocina</p><p class="muted">Paso '+n+' de '+r.steps.length+'</p><div class="progress" aria-hidden="true">'+r.steps.map((_,i)=>'<span'+(i<n?' class="done"':'')+'></span>').join('')+'</div><h1>'+escapeHTML(title)+'</h1><p class="steptext">'+escapeHTML(instruction)+'</p>'+(settings.length?'<div class="settings">'+settings.map(s=>'<b>'+escapeHTML(s)+'</b>').join('')+'</div>':'')+'<div class="row step-actions">'+(n>1?'<a class="btn" href="#cocina/'+r.id+'/'+(n-1)+'">Anterior</a>':'')+'<a class="btn primary" href="#'+(n<r.steps.length?'cocina/'+r.id+'/'+(n+1):'receta/'+r.id)+'">'+(n<r.steps.length?'Siguiente':'Terminar')+'</a></div><details class="info"><summary>Consultar ingredientes</summary>'+ingredientList(r)+'</details></article>';
}
function draftPanel(){
  const draft=state.draft;
  const count=listFor(current(),draft).length;
  dialog.innerHTML='<div class="row between"><h2 id="filter-title">Filtros</h2><div class="row">'+button('Limpiar','draft-clear')+button('<span aria-hidden="true">×</span><span class="sr-only">Cerrar filtros</span>','filter-close')+'</div></div><fieldset><legend>Tiempo total</legend><div class="row">'+[0,15,30,60].map(n=>button(n?'Hasta '+n+' min':'Cualquiera','time:'+n,{klass:'chip',selected:draft.max===n})).join('')+'</div></fieldset><fieldset><legend>Ingredientes</legend>'+tagForm('draft-tags')+(draft.tags.length?'<div class="row" style="margin-top:10px">'+draft.tags.map(t=>button(escapeHTML(t)+' ×','draft-remove:'+t,{klass:'chip',selected:true})).join('')+'</div>':'')+'</fieldset>'+button('Ver '+count+' '+(count===1?'receta':'recetas'),'apply',{primary:true});
}
function addTag(filters,raw){
  const q=normalize(raw);
  if(!q)return;
  const canonical=[...catalog].find(t=>normalize(t)===q)||raw.trim();
  if(!filters.tags.some(t=>normalize(t)===q))filters.tags.push(canonical);
}
function updateList(){
  const results=document.querySelector('#results');
  if(results)results.innerHTML=resultHTML(current());
}
document.addEventListener('submit',event=>{
  const form=event.target;
  event.preventDefault();
  if(form.id==='quick'){
    const value=document.querySelector('#quick-search').value.trim();
    const ingredient=value&&![...recipes].some(r=>normalize(r.title).includes(normalize(value)))&&recipes.some(r=>searchable(r,value));
    state.searchMode=ingredient?'ingredientes':'nombre';
    state.query=ingredient?'':value;
    state.filters={max:0,tags:[]};
    if(ingredient)addTag(state.filters,value);
    location.hash='buscar';
  }
  if(form.id==='search-tags'){
    addTag(state.filters,new FormData(form).get('ingredient'));
    render();document.querySelector('#search-tags input').focus();
  }
  if(form.id==='draft-tags'){
    addTag(state.draft,new FormData(form).get('ingredient'));
    draftPanel();dialog.querySelector('input').focus();
  }
});
document.addEventListener('input',event=>{
  if(event.target.id==='name-search'){state.query=event.target.value;updateList();}
});
document.addEventListener('change',event=>{
  if(event.target.id==='sort'){state.sort=event.target.value;updateList();}
  if(event.target.id==='country-category'){state.countryCategory=event.target.value;updateList();}
  if(event.target.matches('[data-ingredient]')){
    const ingredient=event.target.dataset.ingredient;
    if(event.target.checked)checked.add(ingredient);else checked.delete(ingredient);
    storeIds('mesa-tiempo-ingredientes-v2',checked);
  }
});
document.addEventListener('click',event=>{
  const a=event.target.closest('a');
  if(a?.hasAttribute('data-recipe'))state.from=current().join('/');
  if(a?.hasAttribute('data-category'))state.sub='Todas';
  if(a?.getAttribute('href')?.startsWith('#pais/')&&current()[0]==='indice')state.countryCategory='';
  const control=event.target.closest('[data-action]');
  if(!control)return;
  const [action,...parts]=control.dataset.action.split(':');
  const value=parts.join(':');
  switch(action){
    case 'index':state.mode=value;render();break;
    case 'letter':document.querySelector('#letra-'+value)?.scrollIntoView({block:'start'});break;
    case 'sub':state.sub=value;render();break;
    case 'search':state.searchMode=value;render();document.querySelector('#name-search,#search-tags input')?.focus();break;
    case 'filters':state.draft={max:state.filters.max,tags:[...state.filters.tags]};draftPanel();dialog.showModal();break;
    case 'filter-close':dialog.close();break;
    case 'draft-clear':state.draft={max:0,tags:[]};draftPanel();break;
    case 'time':state.draft.max=Number(value);draftPanel();dialog.querySelector('[data-action="time:'+value+'"]').focus();break;
    case 'draft-remove':state.draft.tags=state.draft.tags.filter(t=>t!==value);draftPanel();dialog.querySelector('input').focus();break;
    case 'apply':state.filters=state.draft;dialog.close();render();document.querySelector('[data-action="filters"]').focus();break;
    case 'clear-time':state.filters.max=0;render();break;
    case 'remove':state.filters.tags=state.filters.tags.filter(t=>t!==value);render();break;
    case 'favorite':
      if(favorites.has(value))favorites.delete(value);else favorites.add(value);
      storeIds('mesa-tiempo-favoritas-v1',favorites);
      render();document.querySelector('[data-action="favorite:'+value+'"]').focus();break;
  }
});
let previousPage=current()[0];
window.addEventListener('hashchange',()=>{
  const page=current()[0];
  if(['indice','inicio','guardadas'].includes(page)&&previousPage!== 'receta'){
    state.filters={max:0,tags:[]};state.sort='az';
  }
  previousPage=page;
  render();window.scrollTo(0,0);app.focus({preventScroll:true});
});
function isUsableCatalog(data){
  const ids=new Set();
  const texts=values=>Array.isArray(values)&&values.every(value=>typeof value==='string');
  return data?.version===1&&Array.isArray(data.recipes)&&data.recipes.length>0&&data.recipes.every(r=>{
    if(!r||!r.id||!/^[a-z0-9-]+$/.test(r.id)||ids.has(r.id)) return false;
    ids.add(r.id);
    return cat(r.category)&&typeof r.title==='string'&&r.title.trim()&&Number.isFinite(r.minutes)&&texts(r.tags)&&texts(r.countries)
      &&(!r.source||(typeof r.source.file==='string'&&Array.isArray(r.source.pages)&&r.source.pages.length>0))
      &&(r.steps?(texts(r.ingredients)&&r.ingredients.length>0&&Array.isArray(r.steps)&&r.steps.length>0&&r.steps.every(s=>texts(s)&&s.length>=2))
        :typeof r.url==='string'&&/^https:\/\//i.test(r.url));
  });
}
async function start(){
  if(location.protocol==='https:'||location.protocol==='http:'){
    try {
      const response=await fetch('./recetas.json',{signal:AbortSignal.timeout(2500)});
      if(response.ok){
        const data=await response.json();
        if(isUsableCatalog(data))recipes=data.recipes;
      }
    }catch{/* The bundled catalog stays available. */}
  }
  catalog=new Set(recipes.flatMap(r=>r.tags));
  const names=[...new Set(recipes.flatMap(r=>r.countries))].sort(compare);
  countries=new Map(names.map(name=>[countryId(name),name]));
  if(recipes.some(r=>!r.countries.length))countries.set('sin-asignar','Sin país asignado');
  if(current()[0]==='pais')state.mode='paises';
  render();
}
start();
</script>
</body>
</html>
